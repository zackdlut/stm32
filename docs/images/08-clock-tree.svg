<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">时钟树：8 MHz 晶振 → PLL → 168 MHz → 各总线（第 6 课的配置）</text>

  <!-- sources -->
  <rect x="20" y="70" width="130" height="56" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="85" y="94" text-anchor="middle" font-weight="bold" fill="#854d0e">HSI 16 MHz</text>
  <text x="85" y="114" text-anchor="middle" font-size="11" fill="#374151">内部 RC，复位默认</text>
  <rect x="20" y="170" width="130" height="56" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="85" y="194" text-anchor="middle" font-weight="bold" fill="#854d0e">HSE 8 MHz</text>
  <text x="85" y="214" text-anchor="middle" font-size="11" fill="#374151">外部晶振，精确</text>

  <!-- PLL source mux -->
  <path d="M190,150 L215,160 L215,236 L190,246 Z" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <path d="M150,98 L172,98 L172,170 L186,170" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M150,198 L172,198 L172,226 L186,226" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="202" y="268" text-anchor="middle" font-size="11" fill="#7c3aed">PLLSRC</text>

  <!-- PLL -->
  <rect x="240" y="140" width="420" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="160" font-size="13" font-weight="bold" fill="#1d4ed8">PLL（RCC_PLLCFGR）</text>
  <rect x="255" y="178" width="60" height="40" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="285" y="203" text-anchor="middle" fill="#111827">÷M 8</text>
  <text x="345" y="192" text-anchor="middle" font-size="11" fill="#374151">1 MHz</text>
  <rect x="375" y="178" width="80" height="40" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="415" y="203" text-anchor="middle" fill="#111827">×N 336</text>
  <text x="487" y="178" text-anchor="middle" font-size="11" fill="#374151">VCO</text>
  <text x="487" y="192" text-anchor="middle" font-size="11" fill="#374151">336 MHz</text>
  <rect x="540" y="160" width="60" height="34" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="570" y="182" text-anchor="middle" fill="#111827">÷P 2</text>
  <rect x="540" y="208" width="60" height="34" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="570" y="230" text-anchor="middle" fill="#111827">÷Q 7</text>
  <line x1="215" y1="198" x2="251" y2="198" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="198" x2="371" y2="198" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M455,198 L520,198 L520,177 L536,177" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M520,198 L520,225 L536,225" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="225" x2="700" y2="225" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="706" y="222" font-size="12" fill="#374151">48 MHz → USB</text>

  <!-- SYSCLK mux -->
  <path d="M700,70 L730,82 L730,190 L700,202 Z" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="715" y="62" text-anchor="middle" font-size="11" fill="#7c3aed">SW</text>
  <line x1="150" y1="88" x2="696" y2="88" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="118" x2="696" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600,177 L696,177" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="650" y="170" text-anchor="middle" font-size="12" fill="#1d4ed8">168 MHz</text>
  <text x="560" y="82" text-anchor="middle" font-size="11" fill="#6b7280">HSI</text>
  <text x="645" y="122" text-anchor="end" font-size="11" fill="#6b7280">HSE（直接选用）</text>

  <rect x="760" y="110" width="110" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="815" y="132" text-anchor="middle" font-weight="bold" fill="#15803d">SYSCLK</text>
  <text x="815" y="151" text-anchor="middle" font-size="12" fill="#111827">168 MHz</text>
  <line x1="730" y1="136" x2="756" y2="136" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- AHB prescaler -->
  <line x1="815" y1="160" x2="815" y2="296" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="770" y="300" width="90" height="40" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="815" y="325" text-anchor="middle" fill="#111827">AHB ÷1</text>
  <line x1="815" y1="340" x2="815" y2="366" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="740" y="370" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="815" y="392" text-anchor="middle" font-weight="bold" fill="#15803d">HCLK 168 MHz</text>
  <text x="815" y="411" text-anchor="middle" font-size="11" fill="#374151">CPU、AHB、GPIO、DMA</text>

  <!-- branches -->
  <line x1="740" y1="395" x2="40" y2="395" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="395" x2="120" y2="436" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="395" x2="380" y2="436" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="395" x2="630" y2="436" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="440" width="170" height="110" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="125" y="464" text-anchor="middle" font-weight="bold" fill="#3730a3">SysTick</text>
  <text x="125" y="488" text-anchor="middle" font-size="12" fill="#111827">HCLK 或 HCLK/8</text>
  <text x="125" y="510" text-anchor="middle" font-size="12" fill="#111827">LOAD = 168000 - 1</text>
  <text x="125" y="532" text-anchor="middle" font-size="12" fill="#111827">→ 1 ms 一次中断</text>

  <rect x="260" y="440" width="240" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="380" y="464" text-anchor="middle" font-weight="bold" fill="#c2410c">APB1 ÷4 → PCLK1 42 MHz</text>
  <text x="380" y="488" text-anchor="middle" font-size="12" fill="#111827">USART2：BRR 按 42 MHz 计算</text>
  <text x="380" y="510" text-anchor="middle" font-size="12" fill="#111827">TIM2~7：分频≠1 时 ×2 = 84 MHz</text>
  <text x="380" y="532" text-anchor="middle" font-size="11" fill="#9a3412">APB1 上限 42 MHz</text>

  <rect x="530" y="440" width="200" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="630" y="464" text-anchor="middle" font-weight="bold" fill="#c2410c">APB2 ÷2 → 84 MHz</text>
  <text x="630" y="488" text-anchor="middle" font-size="12" fill="#111827">USART1/6、SPI1、ADC</text>
  <text x="630" y="510" text-anchor="middle" font-size="12" fill="#111827">TIM1/8/9~11：168 MHz</text>
  <text x="630" y="532" text-anchor="middle" font-size="11" fill="#9a3412">APB2 上限 84 MHz</text>

  <!-- notes -->
  <rect x="760" y="440" width="220" height="140" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="870" y="464" text-anchor="middle" font-weight="bold" fill="#991b1b">切换到 168 MHz 前必须</text>
  <g font-size="12" fill="#111827">
    <text x="774" y="488">① 等 HSE 就绪 HSERDY</text>
    <text x="774" y="508">② FLASH 等待周期设为 5</text>
    <text x="774" y="528">③ 先设好 APB 分频</text>
    <text x="774" y="548">④ 等 PLLRDY，再切 SW</text>
    <text x="774" y="568">⑤ 重算 SysTick 与 BRR</text>
  </g>

  <rect x="20" y="290" width="380" height="80" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="36" y="314" font-weight="bold" fill="#111827">时钟门控（RCC 使能寄存器）</text>
  <text x="36" y="338" font-size="12" fill="#374151">每个外设默认关闭时钟，用之前要先打开：</text>
  <text x="36" y="358" font-size="12" font-family="monospace" fill="#111827">RCC-&gt;AHB1ENR |= GPIODEN;  RCC-&gt;APB1ENR |= USART2EN;</text>
</svg>
