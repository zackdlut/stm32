<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">ADC 把电压变成数字，DAC 把数字变回电压</text>

  <!-- ADC chain -->
  <text x="30" y="70" font-weight="bold" fill="#111827">ADC1：12 位逐次逼近（SAR）</text>
  <g font-size="12">
    <rect x="30" y="86" width="120" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="90" y="108" text-anchor="middle" font-weight="bold" fill="#92400e">模拟输入</text>
    <text x="90" y="130" text-anchor="middle" fill="#111827">PA1 = IN1</text>
    <text x="90" y="150" text-anchor="middle" fill="#111827">PB0 = IN8</text>
    <text x="90" y="170" text-anchor="middle" fill="#111827">…共 16 路</text>
    <text x="90" y="188" text-anchor="middle" fill="#6b7280">MODER = 11 模拟</text>

    <rect x="190" y="86" width="120" height="110" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="250" y="108" text-anchor="middle" font-weight="bold" fill="#111827">多路开关</text>
    <text x="250" y="132" text-anchor="middle" fill="#111827">SQR1..3 规定</text>
    <text x="250" y="150" text-anchor="middle" fill="#111827">转换顺序</text>
    <text x="250" y="174" text-anchor="middle" fill="#6b7280">SQ1=1, SQ2=8</text>

    <rect x="350" y="86" width="130" height="110" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="415" y="108" text-anchor="middle" font-weight="bold" fill="#3730a3">采样保持</text>
    <text x="415" y="132" text-anchor="middle" fill="#111827">电容充电</text>
    <text x="415" y="150" text-anchor="middle" fill="#111827">SMPR：3..480 周期</text>
    <text x="415" y="174" text-anchor="middle" fill="#6b7280">源阻抗大 → 采样要长</text>

    <rect x="520" y="86" width="130" height="110" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="585" y="108" text-anchor="middle" font-weight="bold" fill="#3730a3">SAR 比较</text>
    <text x="585" y="132" text-anchor="middle" fill="#111827">12 次二分</text>
    <text x="585" y="150" text-anchor="middle" fill="#111827">+12 个 ADCCLK</text>
    <text x="585" y="174" text-anchor="middle" fill="#6b7280">ADCCLK ≤ 36 MHz</text>

    <rect x="690" y="86" width="120" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="750" y="108" text-anchor="middle" font-weight="bold" fill="#15803d">DR</text>
    <text x="750" y="132" text-anchor="middle" fill="#111827">0..4095</text>
    <text x="750" y="150" text-anchor="middle" fill="#111827">EOC=1</text>
    <text x="750" y="174" text-anchor="middle" fill="#6b7280">读 DR 清 EOC</text>

    <rect x="850" y="86" width="120" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="910" y="108" text-anchor="middle" font-weight="bold" fill="#1e40af">DMA2 S0</text>
    <text x="910" y="132" text-anchor="middle" fill="#111827">每次 EOC</text>
    <text x="910" y="150" text-anchor="middle" fill="#111827">搬一个结果</text>
    <text x="910" y="174" text-anchor="middle" fill="#6b7280">到 buf[i++]</text>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M150,141 L186,141" marker-end="url(#arrow)"/><path d="M310,141 L346,141" marker-end="url(#arrow)"/>
    <path d="M480,141 L516,141" marker-end="url(#arrow)"/><path d="M650,141 L686,141" marker-end="url(#arrow)"/>
    <path d="M810,141 L846,141" marker-end="url(#arrow)"/>
  </g>

  <!-- formula -->
  <rect x="30" y="216" width="450" height="96" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="46" y="242" font-weight="bold" fill="#111827">换算</text>
  <text x="46" y="268" font-size="13" fill="#111827" font-family="monospace">mV = raw × 3300 / 4095</text>
  <text x="46" y="292" font-size="13" fill="#111827">raw 1241 → 1000 mV；分辨率 3300/4096 ≈ 0.8 mV</text>

  <!-- scan + DMA buffer -->
  <rect x="510" y="216" width="460" height="96" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="526" y="242" font-weight="bold" fill="#1e40af">扫描 + DMA：CPU 不参与每次转换</text>
  <g font-size="11" text-anchor="middle" font-family="monospace">
    <rect x="526" y="256" width="52" height="24" fill="#fef3c7" stroke="#d97706"/><text x="552" y="272">IN1</text>
    <rect x="578" y="256" width="52" height="24" fill="#dcfce7" stroke="#16a34a"/><text x="604" y="272">IN8</text>
    <rect x="630" y="256" width="52" height="24" fill="#fef3c7" stroke="#d97706"/><text x="656" y="272">IN1</text>
    <rect x="682" y="256" width="52" height="24" fill="#dcfce7" stroke="#16a34a"/><text x="708" y="272">IN8</text>
    <rect x="734" y="256" width="52" height="24" fill="#fef3c7" stroke="#d97706"/><text x="760" y="272">IN1</text>
    <rect x="786" y="256" width="52" height="24" fill="#dcfce7" stroke="#16a34a"/><text x="812" y="272">IN8</text>
    <rect x="838" y="256" width="52" height="24" fill="#f3f4f6" stroke="#9ca3af"/><text x="864" y="272">…</text>
  </g>
  <text x="526" y="300" font-size="12" fill="#111827">SCAN + CONT + DMA + DDS；NDTR 到 0 → TC 中断：一整块数据就绪</text>

  <!-- DAC -->
  <text x="30" y="352" font-weight="bold" fill="#111827">DAC1：12 位电阻网络 + 输出缓冲，PA4</text>
  <g font-size="12">
    <rect x="30" y="368" width="150" height="80" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="105" y="394" text-anchor="middle" font-weight="bold" fill="#3730a3">CPU 写</text>
    <text x="105" y="416" text-anchor="middle" font-family="monospace" fill="#111827">DHR12R1 = 2048</text>
    <text x="105" y="436" text-anchor="middle" fill="#6b7280">保持寄存器</text>
    <rect x="230" y="368" width="150" height="80" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="305" y="394" text-anchor="middle" font-weight="bold" fill="#111827">DOR1</text>
    <text x="305" y="416" text-anchor="middle" fill="#111827">TEN=0：下一拍复制</text>
    <text x="305" y="436" text-anchor="middle" fill="#6b7280">TEN=1：等触发</text>
    <rect x="430" y="368" width="150" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="505" y="394" text-anchor="middle" font-weight="bold" fill="#92400e">PA4 电压</text>
    <text x="505" y="416" text-anchor="middle" font-family="monospace" fill="#111827">3.3 V × 2048/4095</text>
    <text x="505" y="436" text-anchor="middle" fill="#111827">≈ 1.650 V</text>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M180,408 L226,408" marker-end="url(#arrow)"/><path d="M380,408 L426,408" marker-end="url(#arrow)"/>
  </g>
  <!-- staircase -->
  <g transform="translate(630,360)">
    <line x1="0" y1="100" x2="330" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="0" y1="100" x2="0" y2="0" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M0,100 L60,100 L60,80 L120,80 L120,60 L180,60 L180,40 L240,40 L240,20 L300,20" stroke="#d97706" stroke-width="2.5" fill="none"/>
    <text x="8" y="12" font-size="11" fill="#374151">电压</text>
    <text x="320" y="116" font-size="11" fill="#374151" text-anchor="end">时间</text>
    <text x="150" y="132" font-size="11" fill="#6b7280" text-anchor="middle">本课：0 → 825 → 1650 → 2475 → 3300 mV</text>
  </g>

  <rect x="30" y="500" width="940" height="46" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="46" y="528" font-size="13" fill="#111827">模拟引脚不要开上拉/下拉；ADC 参考电压就是 VDDA（板上 3.0~3.3 V），精度要求高时用内部 VREFINT 通道反推实际 VDDA。</text>
</svg>
