<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">RTC 和 IWDG 都跑在低速时钟上，主时钟停了它们也照常工作</text>

  <!-- backup domain -->
  <rect x="20" y="56" width="960" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="36" y="80" font-weight="bold" fill="#15803d">备份域（VBAT 供电时掉电不丢；写保护：PWR_CR.DBP=1 才能改）</text>
  <g font-size="12">
    <rect x="40" y="100" width="130" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="105" y="126" text-anchor="middle" font-weight="bold" fill="#92400e">LSE 晶振</text>
    <text x="105" y="148" text-anchor="middle" fill="#111827">32.768 kHz</text>
    <text x="105" y="164" text-anchor="middle" fill="#6b7280">= 2^15 Hz</text>

    <rect x="220" y="100" width="150" height="70" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="295" y="124" text-anchor="middle" font-weight="bold" fill="#111827">异步分频 /128</text>
    <text x="295" y="146" text-anchor="middle" font-family="monospace" fill="#111827">PREDIV_A = 127</text>
    <text x="295" y="162" text-anchor="middle" fill="#6b7280">→ 256 Hz</text>

    <rect x="420" y="100" width="150" height="70" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="495" y="124" text-anchor="middle" font-weight="bold" fill="#111827">同步分频 /256</text>
    <text x="495" y="146" text-anchor="middle" font-family="monospace" fill="#111827">PREDIV_S = 255</text>
    <text x="495" y="162" text-anchor="middle" fill="#6b7280">→ 1 Hz（ck_spre）</text>

    <rect x="620" y="96" width="170" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="705" y="120" text-anchor="middle" font-weight="bold" fill="#15803d">日历 TR / DR</text>
    <text x="705" y="142" text-anchor="middle" font-family="monospace" fill="#111827">22:00:03 BCD</text>
    <text x="705" y="160" text-anchor="middle" font-family="monospace" fill="#111827">26-10-23 周五</text>

    <rect x="620" y="196" width="170" height="44" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="705" y="222" text-anchor="middle" fill="#3730a3">闹钟 A：比较 TR</text>
    <rect x="220" y="196" width="350" height="44" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="395" y="222" text-anchor="middle" fill="#3730a3">唤醒定时器 WUTR：每 (WUTR+1) 个 1 Hz 节拍减到 0</text>
    <rect x="40" y="196" width="130" height="90" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="105" y="220" text-anchor="middle" font-weight="bold" fill="#374151">备份寄存器</text>
    <text x="105" y="242" text-anchor="middle" fill="#111827">BKP0R..BKP19R</text>
    <text x="105" y="262" text-anchor="middle" fill="#6b7280">复位不清零</text>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M170,135 L216,135" marker-end="url(#arrow)"/><path d="M370,135 L416,135" marker-end="url(#arrow)"/>
    <path d="M570,135 L616,135" marker-end="url(#arrow)"/>
    <path d="M705,174 L705,192" marker-end="url(#arrow)"/>
    <path d="M495,170 L495,192" marker-end="url(#arrow)"/>
  </g>
  <!-- EXTI routes -->
  <g font-size="12">
    <rect x="840" y="110" width="120" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="900" y="132" text-anchor="middle" fill="#991b1b">EXTI 17</text>
    <text x="900" y="150" text-anchor="middle" fill="#111827">RTC_Alarm_IRQn</text>
    <rect x="840" y="240" width="120" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="900" y="262" text-anchor="middle" fill="#991b1b">EXTI 22</text>
    <text x="900" y="280" text-anchor="middle" fill="#111827">RTC_WKUP_IRQn</text>
  </g>
  <path d="M790,218 C820,218 815,140 836,138" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M570,232 C700,270 760,268 836,266" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="230" y="272" font-size="11" fill="#991b1b">两路中断都走 EXTI 线 → 能把芯片从 Stop 模式叫醒</text>

  <!-- IWDG -->
  <rect x="20" y="326" width="600" height="240" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="36" y="352" font-weight="bold" fill="#9a3412">独立看门狗 IWDG：一旦启动，除了复位谁也关不掉</text>
  <g font-size="12">
    <rect x="40" y="368" width="110" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="95" y="392" text-anchor="middle" font-weight="bold" fill="#92400e">LSI RC</text>
    <text x="95" y="412" text-anchor="middle" fill="#111827">≈32 kHz（不准）</text>
    <rect x="180" y="368" width="110" height="60" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="235" y="392" text-anchor="middle" font-weight="bold" fill="#111827">PR 分频</text>
    <text x="235" y="412" text-anchor="middle" fill="#111827">/32 → 1 kHz</text>
    <rect x="320" y="368" width="150" height="60" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="395" y="392" text-anchor="middle" font-weight="bold" fill="#111827">12 位递减计数器</text>
    <text x="395" y="412" text-anchor="middle" fill="#111827">从 RLR 开始减</text>
    <rect x="500" y="368" width="100" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="550" y="392" text-anchor="middle" font-weight="bold" fill="#991b1b">减到 0</text>
    <text x="550" y="412" text-anchor="middle" fill="#111827">芯片复位</text>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M150,398 L176,398" marker-end="url(#arrow)"/><path d="M290,398 L316,398" marker-end="url(#arrow)"/>
    <path d="M470,398 L496,398" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#111827" font-family="monospace">
    <text x="40" y="458">KR = 0xCCCC  启动        KR = 0x5555  解锁 PR/RLR</text>
    <text x="40" y="480">KR = 0xAAAA  喂狗：计数器回到 RLR</text>
  </g>
  <!-- counter saw -->
  <g transform="translate(40,494)">
    <path d="M0,10 L80,50 L80,10 L160,50 L160,10 L240,50 L240,10 L360,64" stroke="#ea580c" stroke-width="2" fill="none"/>
    <line x1="0" y1="64" x2="380" y2="64" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="80" y="8" font-size="11" fill="#374151" text-anchor="middle">喂</text>
    <text x="160" y="8" font-size="11" fill="#374151" text-anchor="middle">喂</text>
    <text x="240" y="8" font-size="11" fill="#374151" text-anchor="middle">喂</text>
    <text x="292" y="22" font-size="11" fill="#991b1b">程序卡死，没人喂</text>
    <text x="370" y="62" font-size="11" fill="#991b1b">复位</text>
  </g>

  <!-- comparison -->
  <rect x="640" y="326" width="340" height="240" rx="12" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="656" y="352" font-weight="bold" fill="#111827">怎么知道上次为什么复位</text>
  <g font-size="12" fill="#111827">
    <text x="656" y="380">读 RCC_CSR 的标志位：</text>
    <text x="656" y="404" font-family="monospace">IWDGRSTF  独立看门狗</text>
    <text x="656" y="426" font-family="monospace">WWDGRSTF  窗口看门狗</text>
    <text x="656" y="448" font-family="monospace">SFTRSTF   软件复位</text>
    <text x="656" y="470" font-family="monospace">PORRSTF   上电</text>
    <text x="656" y="492" font-family="monospace">PINRSTF   NRST 引脚</text>
    <text x="656" y="518">读完写 RMVF=1 清除，否则会一直累积。</text>
    <text x="656" y="542" fill="#6b7280">Renode 的 RCC 不记录 IWDGRSTF，</text>
    <text x="656" y="558" fill="#6b7280">本课用 .noinit 变量记录启动次数。</text>
  </g>
</svg>
