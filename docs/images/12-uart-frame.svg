<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">UART：一帧 8N1 数据（发送字符 'A' = 0x41 = 0b0100 0001）</text>

  <!-- frame waveform: bit width 70, start at x=140 -->
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="105" y="74">空闲</text>
    <text x="175" y="74" fill="#dc2626">起始</text>
    <text x="245" y="74">D0</text><text x="315" y="74">D1</text><text x="385" y="74">D2</text><text x="455" y="74">D3</text>
    <text x="525" y="74">D4</text><text x="595" y="74">D5</text><text x="665" y="74">D6</text><text x="735" y="74">D7</text>
    <text x="805" y="74" fill="#16a34a">停止</text>
    <text x="875" y="74">空闲</text>
  </g>
  <g stroke="#e5e7eb">
    <line x1="140" y1="82" x2="140" y2="170"/><line x1="210" y1="82" x2="210" y2="170"/><line x1="280" y1="82" x2="280" y2="170"/>
    <line x1="350" y1="82" x2="350" y2="170"/><line x1="420" y1="82" x2="420" y2="170"/><line x1="490" y1="82" x2="490" y2="170"/>
    <line x1="560" y1="82" x2="560" y2="170"/><line x1="630" y1="82" x2="630" y2="170"/><line x1="700" y1="82" x2="700" y2="170"/>
    <line x1="770" y1="82" x2="770" y2="170"/><line x1="840" y1="82" x2="840" y2="170"/>
  </g>
  <text x="60" y="104" text-anchor="end" font-size="12" fill="#374151">1（高）</text>
  <text x="60" y="154" text-anchor="end" font-size="12" fill="#374151">0（低）</text>
  <!-- bits: start0, 1,0,0,0,0,0,1,0, stop1 -->
  <path d="M70,100 L140,100 L140,150 L210,150 L210,100 L280,100 L280,150 L630,150 L630,100 L700,100 L700,150 L770,150 L770,100 L940,100" fill="none" stroke="#2563eb" stroke-width="3"/>
  <g font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
    <text x="175" y="192">0</text><text x="245" y="192">1</text><text x="315" y="192">0</text><text x="385" y="192">0</text>
    <text x="455" y="192">0</text><text x="525" y="192">0</text><text x="595" y="192">0</text><text x="665" y="192">1</text>
    <text x="735" y="192">0</text><text x="805" y="192">1</text>
  </g>
  <text x="490" y="218" text-anchor="middle" font-size="13" fill="#374151">低位先发：D0..D7 = 1,0,0,0,0,0,1,0 → 0b01000001 = 0x41</text>
  <line x1="210" y1="232" x2="280" y2="232" stroke="#374151" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="245" y="250" text-anchor="middle" font-size="12" fill="#374151">1 位 = 1/115200 s ≈ 8.68 µs</text>
  <text x="700" y="250" text-anchor="middle" font-size="12" fill="#374151">一帧 10 位 → 115200 波特 ≈ 11520 字节/秒</text>

  <!-- wiring -->
  <rect x="20" y="280" width="340" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="306" text-anchor="middle" font-weight="bold" fill="#15803d">接线（交叉连接）</text>
  <rect x="40" y="326" width="110" height="140" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="95" y="350" text-anchor="middle" font-weight="bold" fill="#111827">STM32</text>
  <text x="95" y="384" text-anchor="middle" font-size="12" fill="#111827">PA2 TX</text>
  <text x="95" y="418" text-anchor="middle" font-size="12" fill="#111827">PA3 RX</text>
  <text x="95" y="452" text-anchor="middle" font-size="12" fill="#111827">GND</text>
  <rect x="230" y="326" width="110" height="140" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="285" y="350" text-anchor="middle" font-weight="bold" fill="#111827">USB 转串口</text>
  <text x="285" y="384" text-anchor="middle" font-size="12" fill="#111827">RX</text>
  <text x="285" y="418" text-anchor="middle" font-size="12" fill="#111827">TX</text>
  <text x="285" y="452" text-anchor="middle" font-size="12" fill="#111827">GND</text>
  <line x1="150" y1="380" x2="226" y2="380" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="414" x2="154" y2="414" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="448" x2="230" y2="448" stroke="#111827" stroke-width="2"/>
  <text x="40" y="496" font-size="12" fill="#374151">• PA2/PA3 设为复用功能 AF7（USART2）</text>
  <text x="40" y="518" font-size="12" fill="#374151">• 双方波特率、格式必须一致</text>
  <text x="40" y="540" font-size="12" fill="#374151">• 电平 3.3 V TTL，不能直接接 RS-232</text>
  <text x="40" y="564" font-size="12" fill="#c2410c">• Renode 中：usart2 输出写入 build/uart.log</text>

  <!-- USART internals -->
  <rect x="380" y="280" width="600" height="300" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="680" y="306" text-anchor="middle" font-weight="bold" fill="#c2410c">USART 内部：数据寄存器 + 移位寄存器 + 状态标志</text>

  <text x="400" y="342" font-size="13" font-weight="bold" fill="#1d4ed8">发送</text>
  <rect x="450" y="322" width="100" height="34" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="500" y="344" text-anchor="middle" font-size="12" fill="#111827">CPU 写 DR</text>
  <rect x="580" y="322" width="100" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="630" y="344" text-anchor="middle" font-size="12" fill="#111827">TDR</text>
  <rect x="710" y="322" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="770" y="344" text-anchor="middle" font-size="12" fill="#111827">发送移位寄存器</text>
  <text x="900" y="344" text-anchor="middle" font-size="12" fill="#111827">→ TX 引脚</text>
  <line x1="550" y1="339" x2="576" y2="339" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="339" x2="706" y2="339" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="339" x2="856" y2="339" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="374" text-anchor="middle" font-size="11" fill="#7c3aed">TXE=1：TDR 空，可以写下一个</text>
  <text x="790" y="374" text-anchor="middle" font-size="11" fill="#7c3aed">TC=1：全部发完</text>

  <text x="400" y="420" font-size="13" font-weight="bold" fill="#c2410c">接收</text>
  <text x="490" y="422" text-anchor="middle" font-size="12" fill="#111827">RX 引脚 →</text>
  <rect x="540" y="400" width="120" height="34" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="600" y="422" text-anchor="middle" font-size="12" fill="#111827">接收移位寄存器</text>
  <rect x="690" y="400" width="100" height="34" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="740" y="422" text-anchor="middle" font-size="12" fill="#111827">RDR</text>
  <rect x="820" y="400" width="100" height="34" rx="6" fill="#ffffff" stroke="#ea580c"/>
  <text x="870" y="422" text-anchor="middle" font-size="12" fill="#111827">CPU 读 DR</text>
  <line x1="660" y1="417" x2="686" y2="417" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="417" x2="816" y2="417" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="740" y="452" text-anchor="middle" font-size="11" fill="#7c3aed">RXNE=1：有新字节（读 DR 清除）</text>
  <text x="740" y="470" text-anchor="middle" font-size="11" fill="#dc2626">ORE=1：上一个还没读，新字节丢了</text>

  <rect x="400" y="490" width="560" height="78" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="416" y="514" font-weight="bold" fill="#111827">波特率寄存器 BRR（过采样 16 倍）</text>
  <text x="416" y="538" font-family="monospace" font-size="13" fill="#111827">BRR = round(f_PCLK / baud)</text>
  <text x="416" y="558" font-size="12" fill="#374151">16 MHz / 115200 = 138.9 → 139 = 0x8B（误差 -0.08%）；168 MHz 时 PCLK1 = 42 MHz</text>
</svg>
