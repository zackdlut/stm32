<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1040 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="-40" width="1040" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">上电到 main()：芯片启动的每一步</text>

  <!-- vector table -->
  <text x="160" y="72" text-anchor="middle" font-weight="bold" fill="#15803d">Flash 开头的向量表</text>
  <g font-size="13">
    <g font-family="monospace" fill="#374151" text-anchor="end">
      <text x="68" y="104">0x0800 0000</text>
      <text x="68" y="140">0x0800 0004</text>
      <text x="68" y="176">0x0800 0008</text>
      <text x="68" y="212">0x0800 000C</text>
      <text x="68" y="248">…</text>
      <text x="68" y="284">0x0800 0058</text>
    </g>
    <g stroke="#16a34a" fill="#dcfce7">
      <rect x="76" y="86" width="190" height="30" fill="#bbf7d0"/>
      <rect x="76" y="122" width="190" height="30" fill="#bbf7d0"/>
      <rect x="76" y="158" width="190" height="30"/>
      <rect x="76" y="194" width="190" height="30"/>
      <rect x="76" y="230" width="190" height="30"/>
      <rect x="76" y="266" width="190" height="30"/>
    </g>
    <g fill="#111827">
      <text x="86" y="106">初始栈顶 _estack</text>
      <text x="86" y="142">Reset_Handler 地址 | 1</text>
      <text x="86" y="178">NMI_Handler</text>
      <text x="86" y="214">HardFault_Handler</text>
      <text x="86" y="250">… 其余异常 …</text>
      <text x="86" y="286">EXTI0_IRQHandler …</text>
    </g>
  </g>
  <text x="170" y="322" text-anchor="middle" font-size="12" fill="#6b7280">每项 4 字节；最低位 1 表示 Thumb 指令</text>

  <!-- hardware steps -->
  <rect x="330" y="60" width="300" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="86" text-anchor="middle" font-weight="bold" fill="#1d4ed8">① 硬件自动完成（无需代码）</text>
  <text x="345" y="116" fill="#111827">• 上电/复位，时钟 = HSI 16 MHz</text>
  <text x="345" y="142" fill="#111827">• 读 0x0800 0000 → 装入 SP</text>
  <text x="345" y="168" fill="#111827">• 读 0x0800 0004 → 装入 PC</text>
  <text x="345" y="194" fill="#111827">• 从 Reset_Handler 开始执行</text>
  <path d="M266,101 L300,101 L300,140 L326,140" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M266,137 L290,137 L290,166 L326,166" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- software steps -->
  <rect x="330" y="240" width="300" height="300" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="266" text-anchor="middle" font-weight="bold" fill="#5b21b6">② Reset_Handler（startup.c）</text>
  <g>
    <rect x="350" y="282" width="260" height="42" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="480" y="300" text-anchor="middle" fill="#111827">复制 .data</text>
    <text x="480" y="317" text-anchor="middle" font-size="12" fill="#6b7280">Flash 里的初值 → RAM</text>
    <rect x="350" y="334" width="260" height="42" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="480" y="352" text-anchor="middle" fill="#111827">清零 .bss</text>
    <text x="480" y="369" text-anchor="middle" font-size="12" fill="#6b7280">未初始化的全局变量 = 0</text>
    <rect x="350" y="386" width="260" height="42" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="480" y="404" text-anchor="middle" fill="#111827">SystemInit()</text>
    <text x="480" y="421" text-anchor="middle" font-size="12" fill="#6b7280">打开 FPU（可在此配置时钟）</text>
    <rect x="350" y="438" width="260" height="42" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="480" y="456" text-anchor="middle" fill="#111827">__libc_init_array()</text>
    <text x="480" y="473" text-anchor="middle" font-size="12" fill="#6b7280">C++ 全局构造函数、constructor 属性函数</text>
    <rect x="350" y="490" width="260" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="480" y="514" text-anchor="middle" font-weight="bold" fill="#15803d">main()</text>
  </g>
  <line x1="480" y1="210" x2="480" y2="236" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- why panel -->
  <rect x="670" y="60" width="310" height="480" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="825" y="86" text-anchor="middle" font-weight="bold" fill="#111827">为什么需要这些步骤？</text>
  <g font-size="13" fill="#374151">
    <text x="686" y="118">PC 上程序由操作系统加载，</text>
    <text x="686" y="138">MCU 没有操作系统：</text>
    <text x="686" y="170" fill="#111827" font-weight="bold">• 没人给全局变量赋初值</text>
    <text x="700" y="190">int x = 5; 的 5 存在 Flash，</text>
    <text x="700" y="210">x 本身在 RAM，要自己复制</text>
    <text x="686" y="242" fill="#111827" font-weight="bold">• 没人把 .bss 清零</text>
    <text x="700" y="262">static int y; 上电时是随机值</text>
    <text x="686" y="294" fill="#111827" font-weight="bold">• 没人调用 C++ 构造函数</text>
    <text x="700" y="314">全局对象的构造要手动触发</text>
    <text x="686" y="346" fill="#111827" font-weight="bold">• 栈从哪开始？</text>
    <text x="700" y="366">由向量表第 0 项告诉硬件</text>
    <text x="686" y="398" fill="#111827" font-weight="bold">• main() 不能返回</text>
    <text x="700" y="418">返回后无处可去，</text>
    <text x="700" y="438">所以通常是 while (1) 循环</text>
    <text x="686" y="478" fill="#7c3aed">第 3 课用打印出来的地址</text>
    <text x="686" y="498" fill="#7c3aed">逐项验证这些步骤</text>
  </g>
</svg>
