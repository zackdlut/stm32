<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">SPI：两个移位寄存器连成一个环，每个时钟交换 1 位</text>

  <!-- master -->
  <rect x="40" y="60" width="330" height="200" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="205" y="86" text-anchor="middle" font-weight="bold" fill="#3730a3">STM32 SPI2（主机）</text>
  <rect x="80" y="110" width="250" height="40" fill="#ffffff" stroke="#4f46e5"/>
  <g stroke="#a5b4fc"><line x1="111" y1="110" x2="111" y2="150"/><line x1="142" y1="110" x2="142" y2="150"/><line x1="173" y1="110" x2="173" y2="150"/><line x1="205" y1="110" x2="205" y2="150"/><line x1="236" y1="110" x2="236" y2="150"/><line x1="267" y1="110" x2="267" y2="150"/><line x1="298" y1="110" x2="298" y2="150"/></g>
  <text x="205" y="170" text-anchor="middle" font-size="12" fill="#111827">8 位移位寄存器（写 DR 装入，读 DR 取出）</text>
  <text x="60" y="206" font-size="12" fill="#111827">PB13 SCK　PB15 MOSI　PB14 MISO（AF5）</text>
  <text x="60" y="228" font-size="12" fill="#111827">PB12 普通 GPIO 当 CS（片选，低有效）</text>
  <text x="60" y="250" font-size="12" fill="#6b7280">BR 分频：16 MHz / 4 = 4 MHz</text>

  <!-- slave -->
  <rect x="630" y="60" width="330" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="795" y="86" text-anchor="middle" font-weight="bold" fill="#15803d">MT25Q SPI NOR Flash（从机）</text>
  <rect x="670" y="110" width="250" height="40" fill="#ffffff" stroke="#16a34a"/>
  <g stroke="#86efac"><line x1="701" y1="110" x2="701" y2="150"/><line x1="732" y1="110" x2="732" y2="150"/><line x1="763" y1="110" x2="763" y2="150"/><line x1="795" y1="110" x2="795" y2="150"/><line x1="826" y1="110" x2="826" y2="150"/><line x1="857" y1="110" x2="857" y2="150"/><line x1="888" y1="110" x2="888" y2="150"/></g>
  <text x="795" y="170" text-anchor="middle" font-size="12" fill="#111827">8 位移位寄存器</text>
  <text x="650" y="206" font-size="12" fill="#111827">CS 拉低 → 选中，开始解析命令</text>
  <text x="650" y="228" font-size="12" fill="#111827">CS 拉高 → 命令结束（写/擦除开始执行）</text>
  <text x="650" y="250" font-size="12" fill="#6b7280">16 MB，JEDEC ID 20 BB 18</text>

  <!-- wires -->
  <path d="M330,122 L630,122" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="480" y="114" text-anchor="middle" font-size="12" fill="#1e40af">MOSI：主机最高位先出</text>
  <path d="M670,140 L370,140" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="520" y="158" text-anchor="middle" font-size="12" fill="#15803d">MISO：从机同时送回 1 位</text>
  <path d="M370,196 L630,196" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="190" text-anchor="middle" font-size="12" fill="#374151">SCK（只有主机产生）</text>
  <path d="M370,232 L630,232" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="226" text-anchor="middle" font-size="12" fill="#991b1b">CS（每个从机一根）</text>

  <!-- mode table -->
  <text x="40" y="298" font-weight="bold" fill="#111827">时钟极性 CPOL / 相位 CPHA → 4 种模式（双方必须一致）</text>
  <g font-size="12" fill="#111827">
    <rect x="40" y="310" width="430" height="120" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="56" y="334" font-weight="bold">模式</text><text x="140" y="334" font-weight="bold">CPOL</text><text x="200" y="334" font-weight="bold">CPHA</text><text x="260" y="334" font-weight="bold">空闲 SCK / 采样沿</text>
    <text x="56" y="358">0（本课）</text><text x="150" y="358">0</text><text x="210" y="358">0</text><text x="260" y="358">低 / 上升沿采样</text>
    <text x="56" y="380">1</text><text x="150" y="380">0</text><text x="210" y="380">1</text><text x="260" y="380">低 / 下降沿采样</text>
    <text x="56" y="402">2</text><text x="150" y="402">1</text><text x="210" y="402">0</text><text x="260" y="402">高 / 下降沿采样</text>
    <text x="56" y="424">3</text><text x="150" y="424">1</text><text x="210" y="424">1</text><text x="260" y="424">高 / 上升沿采样</text>
  </g>
  <!-- mode 0 waveform -->
  <g stroke-width="2" fill="none">
    <path stroke="#dc2626" d="M510,330 L540,330 L540,354 L930,354 L930,330 L960,330"/>
    <path stroke="#6b7280" d="M510,394 L560,394 L560,374 L580,374 L580,394 L600,394 L600,374 L620,374 L620,394 L640,394 L640,374 L660,374 L660,394 L680,394 L680,374 L700,374 L700,394 L720,394 L720,374 L740,374 L740,394 L760,394 L760,374 L780,374 L780,394 L800,394 L800,374 L820,374 L820,394 L960,394"/>
    <path stroke="#2563eb" d="M510,420 L550,420 L550,404 L590,404 L590,420 L630,420 L630,404 L710,404 L710,420 L790,420 L790,404 L830,404 L830,420 L960,420"/>
  </g>
  <g font-size="11" fill="#374151" text-anchor="end">
    <text x="505" y="346">CS</text><text x="505" y="388">SCK</text><text x="505" y="416">MOSI</text>
  </g>
  <g stroke="#9ca3af" stroke-dasharray="2 3"><line x1="560" y1="366" x2="560" y2="430"/><line x1="600" y1="366" x2="600" y2="430"/><line x1="640" y1="366" x2="640" y2="430"/></g>
  <text x="740" y="446" text-anchor="middle" font-size="11" fill="#6b7280">数据在 SCK 上升沿被对方采样（虚线）</text>

  <!-- transaction -->
  <rect x="40" y="466" width="920" height="100" rx="10" fill="#fefce8" stroke="#ca8a04"/>
  <text x="56" y="490" font-weight="bold" fill="#111827">一次 READ（0x03）事务：主机为了“收”也必须“发”（发 0x00 当哑元）</text>
  <g font-size="12" font-family="monospace" fill="#111827">
    <text x="56" y="516">MOSI: 03  00  10  00 | 00  00  00 ...</text>
    <text x="56" y="538">MISO: ??  ??  ??  ?? | 48  65  6c ...   ("Hel...")</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="480" y="516">命令 + 24 位地址 0x001000，此时收到的字节丢弃</text>
    <text x="480" y="538">之后每发 1 个哑元字节，就从 Flash 读回 1 个字节</text>
    <text x="56" y="558">写入前必须：WRITE ENABLE（06）→ 擦除（20，整 4 KB 变 FF）→ PAGE PROGRAM（02，只能把 1 改成 0）→ 轮询状态寄存器 WIP=0</text>
  </g>
</svg>
