<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">按键中断的完整路径：PA0 → SYSCFG → EXTI → NVIC → 处理函数</text>

  <!-- pins -->
  <g font-size="12" fill="#111827">
    <rect x="20" y="70" width="60" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="50" y="88" text-anchor="middle" font-weight="bold">PA0</text>
    <rect x="20" y="104" width="60" height="26" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="50" y="122" text-anchor="middle">PB0</text>
    <rect x="20" y="138" width="60" height="26" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="50" y="156" text-anchor="middle">PC0</text>
    <text x="50" y="184" text-anchor="middle">…</text>
    <rect x="20" y="194" width="60" height="26" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="50" y="212" text-anchor="middle">PI0</text>
  </g>
  <line x1="80" y1="83" x2="116" y2="100" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="80" y1="117" x2="116" y2="120" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="80" y1="151" x2="116" y2="140" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="80" y1="207" x2="116" y2="175" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- SYSCFG mux -->
  <path d="M120,80 L160,96 L160,184 L120,200 Z" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="140" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">SYSCFG</text>
  <text x="140" y="242" text-anchor="middle" font-size="11" fill="#7c3aed">EXTICR1[3:0]=0</text>
  <text x="140" y="258" text-anchor="middle" font-size="11" fill="#6b7280">选端口 A</text>
  <line x1="160" y1="140" x2="196" y2="140" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- EXTI block -->
  <rect x="200" y="60" width="440" height="210" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="420" y="84" text-anchor="middle" font-weight="bold" fill="#c2410c">EXTI 第 0 线</text>
  <rect x="220" y="104" width="120" height="72" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="280" y="126" text-anchor="middle" fill="#111827">边沿检测</text>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#7c3aed">RTSR 上升沿</text>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#7c3aed">FTSR 下降沿</text>
  <rect x="370" y="104" width="110" height="72" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="425" y="126" text-anchor="middle" fill="#111827">挂起 PR</text>
  <text x="425" y="148" text-anchor="middle" font-size="11" fill="#dc2626">写 1 清除！</text>
  <text x="425" y="166" text-anchor="middle" font-size="11" fill="#6b7280">读到 1 = 发生过</text>
  <rect x="510" y="104" width="110" height="72" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="565" y="126" text-anchor="middle" fill="#111827">屏蔽 IMR</text>
  <text x="565" y="148" text-anchor="middle" font-size="12" fill="#7c3aed">1 = 允许</text>
  <text x="565" y="166" text-anchor="middle" font-size="11" fill="#6b7280">发给 NVIC</text>
  <line x1="340" y1="140" x2="366" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="140" x2="506" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="206" text-anchor="middle" font-size="12" fill="#374151">16 条线对应引脚号 0~15：PA0、PB0…只能选一个占用第 0 线</text>
  <text x="420" y="228" text-anchor="middle" font-size="12" fill="#374151">线 0~4 各有独立中断；5~9 共用 EXTI9_5；10~15 共用 EXTI15_10</text>
  <text x="420" y="252" text-anchor="middle" font-size="11" fill="#9a3412">（Renode 不模拟 SYSCFG：任何端口的 N 号脚都直连 EXTI N）</text>

  <!-- NVIC -->
  <line x1="620" y1="140" x2="676" y2="140" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="680" y="60" width="140" height="210" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="750" y="84" text-anchor="middle" font-weight="bold" fill="#3730a3">NVIC</text>
  <text x="750" y="112" text-anchor="middle" font-size="12" fill="#111827">IRQ 编号 6</text>
  <text x="750" y="140" text-anchor="middle" font-size="12" fill="#7c3aed">ISER0 位 6</text>
  <text x="750" y="158" text-anchor="middle" font-size="11" fill="#6b7280">使能</text>
  <text x="750" y="186" text-anchor="middle" font-size="12" fill="#7c3aed">IPR[6] 高 4 位</text>
  <text x="750" y="204" text-anchor="middle" font-size="11" fill="#6b7280">优先级 0~15</text>
  <text x="750" y="232" text-anchor="middle" font-size="12" fill="#7c3aed">PRIMASK</text>
  <text x="750" y="250" text-anchor="middle" font-size="11" fill="#6b7280">全局开关 cpsid/cpsie</text>

  <!-- vector -->
  <line x1="820" y1="140" x2="846" y2="140" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="850" y="60" width="130" height="210" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="915" y="84" text-anchor="middle" font-weight="bold" fill="#991b1b">CPU</text>
  <text x="915" y="112" text-anchor="middle" font-size="12" fill="#111827">读向量表</text>
  <text x="915" y="132" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">(16+6)×4</text>
  <text x="915" y="150" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">= 0x58</text>
  <text x="915" y="186" text-anchor="middle" font-size="12" fill="#111827">跳到</text>
  <text x="915" y="206" text-anchor="middle" font-size="11" font-family="monospace" fill="#991b1b">EXTI0_IRQ</text>
  <text x="915" y="222" text-anchor="middle" font-size="11" font-family="monospace" fill="#991b1b">Handler</text>

  <!-- setup steps -->
  <rect x="20" y="290" width="960" height="135" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="36" y="316" font-weight="bold" fill="#111827">配置顺序（第 7 课 button_exti_init）</text>
  <g font-size="13" fill="#111827" font-family="monospace" xml:space="preserve">
    <text x="36" y="344">1. RCC-&gt;APB2ENR |= SYSCFGEN;   SYSCFG-&gt;EXTICR[0] = 端口 A;        // 选路</text>
    <text x="36" y="368">2. EXTI-&gt;IMR |= 1;   EXTI-&gt;RTSR |= 1;   EXTI-&gt;PR = 1;            // 边沿、屏蔽、清旧标志</text>
    <text x="36" y="392">3. nvic_set_priority(EXTI0_IRQn, 5);   nvic_enable_irq(EXTI0_IRQn);</text>
    <text x="36" y="416">4. void EXTI0_IRQHandler(void) { EXTI-&gt;PR = 1;  ... }             // 处理函数里先清 PR</text>
  </g>
</svg>
