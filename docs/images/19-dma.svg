<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">DMA：外设发请求，DMA 搬数据，CPU 只在开始和结束时出场</text>

  <!-- CPU -->
  <rect x="30" y="70" width="170" height="80" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="115" y="102" text-anchor="middle" font-weight="bold" fill="#3730a3">Cortex-M4 CPU</text>
  <text x="115" y="126" text-anchor="middle" font-size="12" fill="#111827">配置一次，然后去干别的</text>

  <!-- DMA1 block -->
  <rect x="290" y="60" width="420" height="250" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="86" text-anchor="middle" font-weight="bold" fill="#1e40af">DMA1（DMA2 结构相同）</text>
  <g font-size="12" fill="#111827">
    <rect x="310" y="100" width="180" height="190" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="400" y="120" text-anchor="middle" font-weight="bold" fill="#1e40af">8 个数据流 Stream 0..7</text>
    <text x="322" y="144">每个 Stream 一组寄存器：</text>
    <text x="322" y="166" font-family="monospace">CR   方向/宽度/递增/中断</text>
    <text x="322" y="186" font-family="monospace">NDTR 剩余次数</text>
    <text x="322" y="206" font-family="monospace">PAR  外设地址</text>
    <text x="322" y="226" font-family="monospace">M0AR 内存地址</text>
    <text x="322" y="246" font-family="monospace">FCR  FIFO 控制</text>
    <text x="322" y="272" fill="#6b7280">状态：LISR/HISR（TC/HT/TE）</text>
    <rect x="510" y="100" width="180" height="190" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="600" y="120" text-anchor="middle" font-weight="bold" fill="#1e40af">每个 Stream 选 1 个通道</text>
    <text x="522" y="144">CHSEL = 0..7：同一个</text>
    <text x="522" y="164">Stream 上挂 8 个外设请求，</text>
    <text x="522" y="184">一次只能选一个。</text>
    <text x="522" y="212">查 RM0090 DMA1/DMA2</text>
    <text x="522" y="232">“request mapping” 表：</text>
    <text x="522" y="256" font-family="monospace">USART2_TX = S6 / Ch4</text>
    <text x="522" y="276" font-family="monospace">ADC1      = S0 / Ch0 (DMA2)</text>
  </g>

  <!-- peripheral and memory -->
  <rect x="790" y="70" width="180" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="880" y="102" text-anchor="middle" font-weight="bold" fill="#92400e">USART2</text>
  <text x="880" y="126" text-anchor="middle" font-size="12" fill="#111827">TXE=1 → 发 DMA 请求</text>
  <rect x="790" y="220" width="180" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="880" y="252" text-anchor="middle" font-weight="bold" fill="#15803d">SRAM</text>
  <text x="880" y="276" text-anchor="middle" font-size="12" fill="#111827">msg[] 缓冲区</text>

  <path d="M200,110 L286,110" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="243" y="100" text-anchor="middle" font-size="11" fill="#3730a3">① 写寄存器</text>
  <path d="M786,128 L714,128" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/>
  <text x="750" y="146" text-anchor="middle" font-size="11" fill="#92400e">② 请求</text>
  <path d="M786,260 L714,260" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="750" y="250" text-anchor="middle" font-size="11" fill="#1e40af">③ 读 1 字节</text>
  <path d="M714,96 L786,96" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="750" y="88" text-anchor="middle" font-size="11" fill="#1e40af">④ 写 DR</text>
  <path d="M290,240 C240,240 220,200 200,150" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="200" y="230" font-size="11" fill="#991b1b">⑤ NDTR=0 → TC 中断</text>

  <!-- timeline -->
  <text x="30" y="350" font-weight="bold" fill="#111827">发送 122 字节（115200 波特，约 10.6 ms）时 CPU 在做什么</text>
  <text x="30" y="386" font-size="13" fill="#111827">轮询</text>
  <rect x="120" y="370" width="820" height="26" fill="#fecaca" stroke="#dc2626"/>
  <text x="530" y="388" text-anchor="middle" font-size="12" fill="#7f1d1d">while (!(SR &amp; TXE)) {}  ×122：CPU 全程空等</text>
  <text x="30" y="430" font-size="13" fill="#111827">DMA</text>
  <rect x="120" y="414" width="40" height="26" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="140" y="432" text-anchor="middle" font-size="11" fill="#312e81">配置</text>
  <rect x="160" y="414" width="740" height="26" fill="#dcfce7" stroke="#16a34a"/>
  <text x="530" y="432" text-anchor="middle" font-size="12" fill="#14532d">CPU 执行其他代码 / WFI 睡眠；DMA 每次 TXE 搬 1 字节</text>
  <rect x="900" y="414" width="40" height="26" fill="#fecaca" stroke="#dc2626"/>
  <text x="920" y="432" text-anchor="middle" font-size="11" fill="#7f1d1d">TC</text>
  <line x1="120" y1="454" x2="940" y2="454" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="940" y="472" text-anchor="end" font-size="11" fill="#6b7280">时间</text>

  <rect x="30" y="486" width="940" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="46" y="510" font-size="13" fill="#111827">三种方向（CR.DIR）：外设→内存（ADC、UART 接收）　内存→外设（UART 发送、SPI）　内存→内存（只有 DMA2 能做）</text>
  <text x="46" y="532" font-size="13" fill="#111827">PSIZE/MSIZE = 每次搬的宽度；PINC/MINC = 每次之后地址是否递增；CIRC = NDTR 到 0 后自动重装，适合连续采样</text>
</svg>
