<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">链接脚本决定每个段放在哪里（stm32f407.ld）</text>

  <!-- FLASH -->
  <text x="230" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">FLASH（只读，掉电保留）</text>
  <g font-family="monospace" font-size="12" fill="#374151" text-anchor="end">
    <text x="118" y="94">0x0810 0000</text>
    <text x="118" y="488">0x0800 0000</text>
  </g>
  <rect x="126" y="84" width="210" height="190" fill="#f9fafb" stroke="#16a34a" stroke-width="2"/>
  <text x="231" y="184" text-anchor="middle" fill="#9ca3af">未使用</text>
  <rect x="126" y="274" width="210" height="40" fill="#fef3c7" stroke="#16a34a" stroke-width="2"/>
  <text x="231" y="292" text-anchor="middle" fill="#92400e">.data 的初值</text>
  <text x="231" y="307" text-anchor="middle" font-size="11" fill="#92400e">（LMA，起点 _sidata）</text>
  <rect x="126" y="314" width="210" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="231" y="336" text-anchor="middle" fill="#111827">.init_array 等</text>
  <rect x="126" y="348" width="210" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="231" y="366" text-anchor="middle" fill="#111827">.rodata</text>
  <text x="231" y="381" text-anchor="middle" font-size="11" fill="#6b7280">const 数据、字符串常量</text>
  <rect x="126" y="388" width="210" height="62" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="231" y="416" text-anchor="middle" fill="#111827">.text</text>
  <text x="231" y="434" text-anchor="middle" font-size="11" fill="#6b7280">函数的机器码</text>
  <rect x="126" y="450" width="210" height="34" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="231" y="472" text-anchor="middle" font-weight="bold" fill="#111827">.isr_vector 向量表</text>

  <!-- RAM -->
  <text x="720" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">RAM（可读写，掉电丢失）</text>
  <g font-family="monospace" font-size="12" fill="#374151" text-anchor="end">
    <text x="608" y="94">0x2002 0000 = _estack</text>
    <text x="608" y="488">0x2000 0000</text>
  </g>
  <rect x="616" y="84" width="210" height="70" fill="#fee2e2" stroke="#2563eb" stroke-width="2"/>
  <text x="721" y="112" text-anchor="middle" font-weight="bold" fill="#991b1b">栈 stack</text>
  <text x="721" y="132" text-anchor="middle" font-size="12" fill="#991b1b">局部变量、函数调用</text>
  <line x1="721" y1="154" x2="721" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="732" y="182" font-size="12" fill="#dc2626">向下增长</text>
  <rect x="616" y="154" width="210" height="150" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="721" y="244" text-anchor="middle" fill="#9ca3af">空闲</text>
  <line x1="721" y1="304" x2="721" y2="262" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="732" y="286" font-size="12" fill="#dc2626">向上增长</text>
  <rect x="616" y="304" width="210" height="56" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/>
  <text x="721" y="328" text-anchor="middle" fill="#92400e">堆 heap（malloc/new）</text>
  <text x="721" y="347" text-anchor="middle" font-size="11" fill="#92400e">从符号 end 开始，_sbrk 管理</text>
  <rect x="616" y="360" width="210" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="721" y="386" text-anchor="middle" fill="#111827">.bss</text>
  <text x="721" y="405" text-anchor="middle" font-size="11" fill="#6b7280">_sbss ~ _ebss，启动时清零</text>
  <rect x="616" y="420" width="210" height="64" fill="#fde68a" stroke="#2563eb" stroke-width="2"/>
  <text x="721" y="446" text-anchor="middle" fill="#111827">.data（VMA）</text>
  <text x="721" y="465" text-anchor="middle" font-size="11" fill="#6b7280">_sdata ~ _edata</text>

  <!-- copy arrow -->
  <path d="M336,294 C470,294 480,452 612,452" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="474" y="236" text-anchor="middle" font-weight="bold" fill="#dc2626">Reset_Handler 复制</text>
  <text x="474" y="256" text-anchor="middle" font-size="12" fill="#dc2626">AT&gt; FLASH：存放在 FLASH</text>
  <text x="474" y="274" text-anchor="middle" font-size="12" fill="#dc2626">&gt; RAM：运行时在 RAM</text>

  <!-- legend -->
  <rect x="860" y="84" width="125" height="400" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="922" y="110" text-anchor="middle" font-weight="bold" fill="#111827">C 代码 → 段</text>
  <g font-size="12" fill="#374151">
    <text x="872" y="140" font-family="monospace">void f() {}</text>
    <text x="872" y="158">→ .text</text>
    <text x="872" y="190" font-family="monospace">const int k=1;</text>
    <text x="872" y="208">→ .rodata</text>
    <text x="872" y="240" font-family="monospace">int a = 5;</text>
    <text x="872" y="258">→ .data</text>
    <text x="872" y="290" font-family="monospace">int b;</text>
    <text x="872" y="308">→ .bss</text>
    <text x="872" y="340" font-family="monospace">malloc(16)</text>
    <text x="872" y="358">→ 堆</text>
    <text x="872" y="390" font-family="monospace">int local;</text>
    <text x="872" y="408">→ 栈</text>
    <text x="872" y="446" fill="#6b7280">LMA = 加载地址</text>
    <text x="872" y="466" fill="#6b7280">VMA = 运行地址</text>
  </g>

  <text x="500" y="530" text-anchor="middle" font-size="13" fill="#374151">用 arm-none-eabi-size / nm 查看各段大小与符号地址；第 3 课在运行时打印它们</text>
</svg>
