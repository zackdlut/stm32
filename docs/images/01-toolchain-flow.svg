<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">从源代码到芯片里运行：嵌入式工具链</text>

  <rect x="30" y="70" width="150" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="105" y="96" text-anchor="middle" font-weight="bold" fill="#5b21b6">源代码</text>
  <text x="105" y="122" text-anchor="middle" fill="#374151">main.c</text>
  <text x="105" y="142" text-anchor="middle" fill="#374151">startup.c / .s</text>
  <text x="105" y="162" text-anchor="middle" fill="#374151">stm32f407.h</text>

  <rect x="215" y="85" width="180" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="305" y="115" text-anchor="middle" font-weight="bold" fill="#1d4ed8">编译</text>
  <text x="305" y="140" text-anchor="middle" fill="#374151" font-family="monospace" font-size="12">arm-none-eabi-gcc -c</text>

  <rect x="430" y="95" width="100" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="480" y="121" text-anchor="middle" fill="#111827">目标文件</text>
  <text x="480" y="142" text-anchor="middle" fill="#374151" font-family="monospace">*.o</text>

  <rect x="580" y="85" width="150" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="115" text-anchor="middle" font-weight="bold" fill="#1d4ed8">链接</text>
  <text x="655" y="140" text-anchor="middle" fill="#374151" font-size="13">ld（由 gcc 调用）</text>

  <rect x="560" y="205" width="190" height="70" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="655" y="232" text-anchor="middle" fill="#854d0e">链接脚本 stm32f407.ld</text>
  <text x="655" y="255" text-anchor="middle" fill="#854d0e">C 库 newlib-nano / libgcc</text>

  <rect x="790" y="85" width="160" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="870" y="115" text-anchor="middle" font-weight="bold" fill="#15803d">firmware.elf</text>
  <text x="870" y="138" text-anchor="middle" fill="#374151" font-size="13">机器码 + 地址</text>
  <text x="870" y="156" text-anchor="middle" fill="#374151" font-size="13">+ 调试符号</text>

  <line x1="180" y1="125" x2="211" y2="125" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="125" x2="426" y2="125" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="125" x2="576" y2="125" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="655" y1="205" x2="655" y2="169" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="125" x2="786" y2="125" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="870" y1="165" x2="870" y2="300" stroke="#374151" stroke-width="2"/>
  <line x1="870" y1="300" x2="210" y2="300" stroke="#374151" stroke-width="2"/>
  <line x1="210" y1="300" x2="210" y2="326" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="300" x2="530" y2="326" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="300" x2="825" y2="326" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="330" width="300" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="210" y="358" text-anchor="middle" font-weight="bold" fill="#c2410c">Renode 模拟器（本教程）</text>
  <text x="210" y="382" text-anchor="middle" fill="#374151" font-size="13">虚拟 STM32F4 Discovery 板</text>
  <text x="210" y="400" text-anchor="middle" fill="#374151" font-size="13">串口输出 / LED 日志 / GDB</text>

  <rect x="390" y="330" width="280" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="530" y="358" text-anchor="middle" font-weight="bold" fill="#c2410c">真实开发板</text>
  <text x="530" y="382" text-anchor="middle" fill="#374151" font-size="13">OpenOCD / st-flash</text>
  <text x="530" y="400" text-anchor="middle" fill="#374151" font-size="13">经 ST-LINK (SWD) 烧录调试</text>

  <rect x="700" y="330" width="250" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="825" y="358" text-anchor="middle" font-weight="bold" fill="#111827">分析工具</text>
  <text x="825" y="382" text-anchor="middle" fill="#374151" font-size="13" font-family="monospace">objcopy → .bin</text>
  <text x="825" y="400" text-anchor="middle" fill="#374151" font-size="13" font-family="monospace">objdump / size / nm</text>
</svg>
