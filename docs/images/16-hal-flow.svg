<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">HAL 工程的调用关系：初始化走 MSP，中断走回调</text>

  <!-- column headers -->
  <g font-weight="bold" text-anchor="middle">
    <rect x="20" y="52" width="300" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="170" y="74" fill="#5b21b6">main.c（你的代码）</text>
    <rect x="350" y="52" width="300" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="500" y="74" fill="#1d4ed8">HAL 库（ST 提供，不修改）</text>
    <rect x="680" y="52" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="830" y="74" fill="#15803d">msp.c / it.c（你的代码）</text>
  </g>

  <text x="20" y="114" font-size="13" font-weight="bold" fill="#374151">初始化流程</text>
  <g font-size="13" fill="#111827" font-family="monospace">
    <rect x="40" y="126" width="260" height="30" rx="5" fill="#ffffff" stroke="#7c3aed"/>
    <text x="52" y="146">HAL_Init()</text>
    <rect x="370" y="126" width="260" height="30" rx="5" fill="#ffffff" stroke="#2563eb"/>
    <text x="382" y="146">SysTick 1 kHz、优先级分组</text>
    <rect x="700" y="126" width="260" height="30" rx="5" fill="#ffffff" stroke="#16a34a"/>
    <text x="712" y="146">HAL_MspInit()</text>

    <rect x="40" y="170" width="260" height="30" rx="5" fill="#ffffff" stroke="#7c3aed"/>
    <text x="52" y="190">SystemClock_Config()</text>
    <rect x="370" y="170" width="260" height="30" rx="5" fill="#ffffff" stroke="#2563eb"/>
    <text x="382" y="190">HAL_RCC_OscConfig/ClockConfig</text>

    <rect x="40" y="214" width="260" height="30" rx="5" fill="#ffffff" stroke="#7c3aed"/>
    <text x="52" y="234">MX_USART2_UART_Init()</text>
    <rect x="370" y="214" width="260" height="30" rx="5" fill="#ffffff" stroke="#2563eb"/>
    <text x="382" y="234">HAL_UART_Init(&amp;huart2)</text>
    <rect x="700" y="214" width="260" height="56" rx="5" fill="#ffffff" stroke="#16a34a"/>
    <text x="712" y="234">HAL_UART_MspInit()</text>
    <text x="712" y="256" font-size="11" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" fill="#374151">开时钟、PA2/PA3 设 AF7、开 NVIC</text>
  </g>
  <line x1="300" y1="141" x2="366" y2="141" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="141" x2="696" y2="141" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="185" x2="366" y2="185" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="229" x2="366" y2="229" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="229" x2="696" y2="229" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="663" y="222" text-anchor="middle" font-size="10" fill="#6b7280">回调</text>
  <text x="663" y="134" text-anchor="middle" font-size="10" fill="#6b7280">回调</text>

  <rect x="320" y="276" width="360" height="38" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="500" y="292" text-anchor="middle" font-size="12" fill="#374151">MSP = MCU Support Package：外设本身的配置在 HAL，</text>
  <text x="500" y="308" text-anchor="middle" font-size="12" fill="#374151">“接在哪个引脚、用哪个中断”这类板级细节留给你</text>

  <!-- interrupt flow -->
  <line x1="20" y1="330" x2="980" y2="330" stroke="#e5e7eb" stroke-width="2"/>
  <text x="20" y="356" font-size="13" font-weight="bold" fill="#374151">中断流程（收到一个字节）</text>

  <rect x="700" y="372" width="260" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="712" y="394" font-family="monospace" font-size="13" fill="#111827">USART2_IRQHandler()</text>
  <text x="712" y="416" font-size="11" fill="#374151">stm32f4xx_it.c，名字来自向量表</text>
  <rect x="370" y="372" width="260" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="382" y="394" font-family="monospace" font-size="13" fill="#111827">HAL_UART_IRQHandler()</text>
  <text x="382" y="416" font-size="11" fill="#374151">读状态、存字节、计数、清标志</text>
  <rect x="40" y="372" width="260" height="56" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="52" y="394" font-family="monospace" font-size="13" fill="#111827">HAL_UART_RxCpltCallback()</text>
  <text x="52" y="416" font-size="11" fill="#374151">收满 N 字节后调用；需重新 Receive_IT</text>
  <line x1="700" y1="400" x2="634" y2="400" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="370" y1="400" x2="304" y2="400" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M960,360 L960,350 L830,350 L830,368" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="895" y="344" text-anchor="middle" font-size="11" fill="#dc2626">硬件触发</text>

  <rect x="700" y="444" width="260" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="712" y="464" font-family="monospace" font-size="13" fill="#111827">EXTI0_IRQHandler()</text>
  <rect x="370" y="444" width="260" height="30" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="382" y="464" font-family="monospace" font-size="12" fill="#111827">HAL_GPIO_EXTI_IRQHandler()</text>
  <rect x="40" y="444" width="260" height="30" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="52" y="464" font-family="monospace" font-size="13" fill="#111827">HAL_GPIO_EXTI_Callback()</text>
  <line x1="700" y1="459" x2="634" y2="459" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="370" y1="459" x2="304" y2="459" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="700" y="488" width="260" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="712" y="508" font-family="monospace" font-size="13" fill="#111827">SysTick_Handler()</text>
  <rect x="370" y="488" width="260" height="30" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="382" y="508" font-family="monospace" font-size="13" fill="#111827">HAL_IncTick()  uwTick++</text>
  <line x1="700" y1="503" x2="634" y2="503" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="170" y="508" text-anchor="middle" font-size="12" fill="#374151">HAL_Delay() / HAL_GetTick() 依赖它</text>

  <text x="500" y="552" text-anchor="middle" font-size="13" fill="#111827">回调函数在 HAL 里是 __weak 空函数，你在 main.c 里写同名函数即可覆盖（链接器选强符号）</text>
</svg>
