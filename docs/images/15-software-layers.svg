<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">STM32 软件分层：同一件事“点亮 PD12”的几种写法</text>

  <!-- layers left -->
  <rect x="20" y="60" width="400" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="220" y="88" text-anchor="middle" font-weight="bold" fill="#5b21b6">应用程序 main.c / main.cpp</text>
  <text x="220" y="112" text-anchor="middle" font-size="12" fill="#374151">业务逻辑、状态机、命令行……</text>

  <rect x="20" y="140" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="166" text-anchor="middle" font-weight="bold" fill="#1d4ed8">HAL 库</text>
  <text x="115" y="188" text-anchor="middle" font-size="12" fill="#374151">句柄 + 回调，易移植</text>
  <text x="115" y="206" text-anchor="middle" font-size="12" fill="#374151">代码量大（第 12 课）</text>
  <rect x="230" y="140" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="325" y="166" text-anchor="middle" font-weight="bold" fill="#1d4ed8">LL 库</text>
  <text x="325" y="188" text-anchor="middle" font-size="12" fill="#374151">寄存器的薄封装</text>
  <text x="325" y="206" text-anchor="middle" font-size="12" fill="#374151">内联函数，接近裸写</text>

  <rect x="20" y="230" width="400" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="256" text-anchor="middle" font-weight="bold" fill="#15803d">CMSIS（第 11 课）</text>
  <text x="220" y="280" text-anchor="middle" font-size="12" fill="#374151">ARM：core_cm4.h（NVIC_*、SysTick_Config、__WFI）</text>
  <text x="220" y="302" text-anchor="middle" font-size="12" fill="#374151">ST：stm32f407xx.h（GPIOD-&gt;ODR、GPIO_ODR_OD12 等定义）</text>

  <rect x="20" y="330" width="400" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="220" y="356" text-anchor="middle" font-weight="bold" fill="#854d0e">寄存器（第 2~10 课自己写的 stm32f407.h）</text>
  <text x="220" y="378" text-anchor="middle" font-size="12" fill="#374151">本质都是对固定地址的 volatile 读写</text>

  <rect x="20" y="400" width="400" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="220" y="430" text-anchor="middle" font-weight="bold" fill="#c2410c">硬件：Cortex-M4 内核 + ST 外设</text>
  <text x="220" y="456" text-anchor="middle" font-size="12" fill="#374151">参考手册 RM0090 描述每一个寄存器位</text>

  <!-- code examples right -->
  <rect x="450" y="60" width="530" height="420" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g font-size="13">
    <text x="470" y="90" font-weight="bold" fill="#c2410c">① 裸地址（第 2 课）</text>
    <text x="470" y="112" font-family="monospace" fill="#111827">*(volatile uint32_t *)0x40020C18 = 1u &lt;&lt; 12;</text>

    <text x="470" y="150" font-weight="bold" fill="#854d0e">② 结构体寄存器（第 4 课起）</text>
    <text x="470" y="172" font-family="monospace" fill="#111827">GPIOD-&gt;BSRR = BIT(12);</text>

    <text x="470" y="210" font-weight="bold" fill="#15803d">③ CMSIS 设备头（第 11 课）</text>
    <text x="470" y="232" font-family="monospace" fill="#111827">GPIOD-&gt;BSRR = GPIO_BSRR_BS12;</text>

    <text x="470" y="270" font-weight="bold" fill="#1d4ed8">④ LL</text>
    <text x="470" y="292" font-family="monospace" fill="#111827">LL_GPIO_SetOutputPin(GPIOD, LL_GPIO_PIN_12);</text>

    <text x="470" y="330" font-weight="bold" fill="#1d4ed8">⑤ HAL（第 12 课）</text>
    <text x="470" y="352" font-family="monospace" fill="#111827">HAL_GPIO_WritePin(GPIOD, GPIO_PIN_12,</text>
    <text x="470" y="370" font-family="monospace" fill="#111827" xml:space="preserve">                  GPIO_PIN_SET);</text>

    <text x="470" y="408" font-weight="bold" fill="#5b21b6">⑥ C++ 模板（第 14 课）</text>
    <text x="470" y="430" font-family="monospace" fill="#111827">GreenLed::set();   // 编译后仍是一条 str</text>

    <text x="470" y="466" font-size="12" fill="#6b7280">①②③④⑥ 编译后几乎相同；HAL 多了参数检查与函数调用</text>
  </g>
</svg>
