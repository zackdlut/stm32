<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">HardFault 现场分析：从栈帧找回出错的那一行</text>

  <!-- step chain -->
  <rect x="20" y="60" width="200" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="86" text-anchor="middle" font-weight="bold" fill="#991b1b">① 出错指令</text>
  <text x="120" y="108" text-anchor="middle" font-size="12" fill="#111827">除以 0 / 非法指令</text>
  <text x="120" y="124" text-anchor="middle" font-size="12" fill="#111827">跳到偶数地址…</text>
  <rect x="260" y="60" width="200" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="86" text-anchor="middle" font-weight="bold" fill="#1d4ed8">② 硬件压栈</text>
  <text x="360" y="108" text-anchor="middle" font-size="12" fill="#111827">8 个寄存器 → 当前栈</text>
  <text x="360" y="124" text-anchor="middle" font-size="12" fill="#111827">LR = EXC_RETURN</text>
  <rect x="500" y="60" width="220" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="610" y="86" text-anchor="middle" font-weight="bold" fill="#5b21b6">③ HardFault_Handler</text>
  <text x="610" y="108" text-anchor="middle" font-size="12" fill="#111827">naked 汇编：判断 LR 位 2</text>
  <text x="610" y="124" text-anchor="middle" font-size="12" fill="#111827">取 MSP 或 PSP → frame</text>
  <rect x="760" y="60" width="220" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="870" y="86" text-anchor="middle" font-weight="bold" fill="#15803d">④ fault_report()</text>
  <text x="870" y="108" text-anchor="middle" font-size="12" fill="#111827">打印 frame-&gt;pc 与 CFSR</text>
  <text x="870" y="124" text-anchor="middle" font-size="12" fill="#111827">addr2line 定位源码行</text>
  <line x1="220" y1="95" x2="256" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="95" x2="496" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="95" x2="756" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stack frame -->
  <text x="200" y="170" text-anchor="middle" font-weight="bold" fill="#111827">栈上的异常帧（frame 指针）</text>
  <g font-size="13">
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="110" y="184" width="180" height="30"/><rect x="110" y="214" width="180" height="30" fill="#fde68a"/>
      <rect x="110" y="244" width="180" height="30"/><rect x="110" y="274" width="180" height="30"/>
      <rect x="110" y="304" width="180" height="30"/><rect x="110" y="334" width="180" height="30"/>
      <rect x="110" y="364" width="180" height="30"/><rect x="110" y="394" width="180" height="30"/>
    </g>
    <g font-family="monospace" fill="#374151" text-anchor="end" font-size="12">
      <text x="100" y="204">+0x1C</text><text x="100" y="234">+0x18</text><text x="100" y="264">+0x14</text>
      <text x="100" y="294">+0x10</text><text x="100" y="324">+0x0C</text><text x="100" y="354">+0x08</text>
      <text x="100" y="384">+0x04</text><text x="100" y="414">frame →</text>
    </g>
    <g font-family="monospace" fill="#111827" text-anchor="middle">
      <text x="200" y="204">xPSR</text><text x="200" y="234" font-weight="bold">PC  出错地址</text>
      <text x="200" y="264">LR  调用者</text><text x="200" y="294">R12</text>
      <text x="200" y="324">R3</text><text x="200" y="354">R2</text>
      <text x="200" y="384">R1</text><text x="200" y="414">R0</text>
    </g>
  </g>
  <path d="M290,229 L340,229" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="346" y="226" font-size="12" fill="#92400e">addr2line -e firmware.elf PC</text>
  <text x="346" y="244" font-size="12" fill="#92400e">→ compute_average  main.c:37</text>

  <!-- EXC_RETURN -->
  <rect x="20" y="444" width="440" height="100" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="36" y="468" font-weight="bold" fill="#111827">EXC_RETURN（进入异常时 LR 的值）</text>
  <g font-size="12" fill="#111827">
    <text x="36" y="492"><tspan font-family="monospace">0xFFFFFFF9</tspan>  返回线程模式，用 MSP（裸机常见）</text>
    <text x="36" y="512"><tspan font-family="monospace">0xFFFFFFFD</tspan>  返回线程模式，用 PSP（RTOS 任务）</text>
    <text x="36" y="532"><tspan font-family="monospace">0xFFFFFFE9</tspan>  同 F9，但栈帧里还有 FPU 寄存器</text>
  </g>

  <!-- CFSR -->
  <rect x="545" y="160" width="435" height="384" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="762" y="186" text-anchor="middle" font-weight="bold" fill="#991b1b">故障状态寄存器（SCB，0xE000ED28 起）</text>
  <g font-size="12" fill="#111827">
    <text x="560" y="214" font-weight="bold">CFSR = UFSR[31:16] | BFSR[15:8] | MMFSR[7:0]</text>
    <text x="560" y="242" font-weight="bold" fill="#991b1b">UsageFault（UFSR）</text>
    <text x="574" y="262">DIVBYZERO  除以 0（需先置 CCR.DIV_0_TRP）</text>
    <text x="574" y="280">UNDEFINSTR  未定义指令（如 udf）</text>
    <text x="574" y="298">INVSTATE  跳到偶数地址，Thumb 位为 0</text>
    <text x="574" y="316">UNALIGNED  非对齐访问（需开 UNALIGN_TRP）</text>
    <text x="560" y="344" font-weight="bold" fill="#991b1b">BusFault（BFSR）</text>
    <text x="574" y="364">PRECISERR + BFARVALID  无效地址，见 BFAR</text>
    <text x="574" y="382">IMPRECISERR  写缓冲导致，PC 不精确</text>
    <text x="560" y="410" font-weight="bold" fill="#991b1b">MemManage（MMFSR）</text>
    <text x="574" y="430">MPU 违规、在不可执行区取指</text>
    <text x="560" y="458" font-weight="bold" fill="#991b1b">HFSR</text>
    <text x="574" y="478">FORCED  子故障没单独使能，升级为 HardFault</text>
    <text x="574" y="496">VECTTBL  读向量表出错</text>
    <text x="560" y="526" fill="#6b7280">SHCSR 置 USGFAULTENA 等位后各进各的处理函数</text>
  </g>
</svg>
