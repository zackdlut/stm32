<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">FreeRTOS：任何时刻只有一个任务在跑，调度器总是挑“就绪里优先级最高的”</text>

  <!-- state machine -->
  <g font-size="13">
    <ellipse cx="150" cy="130" rx="85" ry="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="150" y="126" text-anchor="middle" font-weight="bold" fill="#15803d">Running</text>
    <text x="150" y="146" text-anchor="middle" font-size="11" fill="#111827">正在占用 CPU</text>
    <ellipse cx="420" cy="130" rx="85" ry="34" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="420" y="126" text-anchor="middle" font-weight="bold" fill="#92400e">Ready</text>
    <text x="420" y="146" text-anchor="middle" font-size="11" fill="#111827">能跑，在排队</text>
    <ellipse cx="285" cy="260" rx="85" ry="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="285" y="256" text-anchor="middle" font-weight="bold" fill="#1e40af">Blocked</text>
    <text x="285" y="276" text-anchor="middle" font-size="11" fill="#111827">等时间/队列/信号量</text>
    <ellipse cx="560" cy="260" rx="70" ry="30" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="560" y="265" text-anchor="middle" font-weight="bold" fill="#4b5563">Suspended</text>
  </g>
  <g stroke="#374151" stroke-width="1.8" fill="none">
    <path d="M232,118 L332,118" marker-end="url(#arrow)"/>
    <path d="M336,142 L236,142" marker-end="url(#arrow)"/>
    <path d="M140,164 C150,220 180,250 198,256" marker-end="url(#arrow)"/>
    <path d="M360,240 C400,220 415,190 418,168" marker-end="url(#arrow)"/>
    <path d="M490,150 C520,180 545,200 552,228" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  </g>
  <g font-size="11" fill="#374151">
    <text x="282" y="110" text-anchor="middle">被更高优先级抢占 / 时间片到</text>
    <text x="282" y="160" text-anchor="middle">被调度器选中</text>
    <text x="40" y="226">vTaskDelay()</text><text x="40" y="242">xQueueReceive() 没数据</text>
    <text x="400" y="212">时间到 / 数据来了</text><text x="400" y="228">/ 信号量被 Give</text>
    <text x="560" y="206">vTaskSuspend()</text>
  </g>

  <!-- context switch box -->
  <rect x="650" y="56" width="330" height="250" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="666" y="82" font-weight="bold" fill="#111827">切换任务靠三个异常</text>
  <g font-size="12" fill="#111827">
    <text x="666" y="108"><tspan font-weight="bold">SysTick</tspan>（1 kHz）：tick 计数 +1，</text>
    <text x="666" y="126">　检查谁的延时到了 → 可能挂起 PendSV</text>
    <text x="666" y="152"><tspan font-weight="bold">PendSV</tspan>（最低优先级）：真正的切换</text>
    <text x="666" y="170">　硬件已压 R0-R3,R12,LR,PC,xPSR</text>
    <text x="666" y="188">　软件再压 R4-R11（和 S16-S31）</text>
    <text x="666" y="206">　保存 PSP → 选新任务 → 恢复它的 PSP</text>
    <text x="666" y="232"><tspan font-weight="bold">SVC</tspan>：启动第一个任务</text>
    <text x="666" y="258" fill="#6b7280">每个任务有自己的栈（PSP），</text>
    <text x="666" y="276" fill="#6b7280">中断和内核用 MSP。</text>
    <text x="666" y="294" fill="#6b7280">FreeRTOSConfig.h 把三者映射到向量名。</text>
  </g>

  <!-- timeline -->
  <text x="20" y="342" font-weight="bold" fill="#111827">第 22 课的一段时间线（优先级：button 3 &gt; sensor 2 &gt; logger 1 &gt; IDLE 0）</text>
  <g font-size="12" fill="#111827" text-anchor="end">
    <text x="110" y="378">button (3)</text><text x="110" y="414">sensor (2)</text><text x="110" y="450">logger (1)</text><text x="110" y="486">IDLE (0)</text>
    <text x="110" y="522">EXTI0 中断</text>
  </g>
  <g stroke="#e5e7eb"><line x1="120" y1="384" x2="960" y2="384"/><line x1="120" y1="420" x2="960" y2="420"/><line x1="120" y1="456" x2="960" y2="456"/><line x1="120" y1="492" x2="960" y2="492"/><line x1="120" y1="528" x2="960" y2="528"/></g>
  <!-- bars -->
  <rect x="160" y="400" width="30" height="20" fill="#f59e0b"/>
  <rect x="190" y="436" width="60" height="20" fill="#3b82f6"/>
  <rect x="250" y="472" width="210" height="20" fill="#d1d5db"/>
  <rect x="460" y="508" width="14" height="20" fill="#dc2626"/>
  <rect x="474" y="364" width="40" height="20" fill="#16a34a"/>
  <rect x="514" y="472" width="230" height="20" fill="#d1d5db"/>
  <rect x="744" y="400" width="30" height="20" fill="#f59e0b"/>
  <rect x="774" y="436" width="60" height="20" fill="#3b82f6"/>
  <rect x="834" y="472" width="126" height="20" fill="#d1d5db"/>
  <g font-size="11" fill="#111827">
    <text x="146" y="396">200 ms</text>
    <text x="220" y="450" fill="#ffffff" text-anchor="middle">printf</text>
    <text x="300" y="488" fill="#374151">WFI 睡眠（空闲钩子）</text>
    <text x="440" y="546" fill="#991b1b">按键：GiveFromISR</text>
    <text x="520" y="378" fill="#15803d">立刻切到 button</text>
    <text x="730" y="396">400 ms</text>
  </g>
  <path d="M474,512 C480,470 476,420 486,388" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>
    <text x="20" y="566" font-size="11" fill="#374151">sensor 放进队列 → logger 从 Blocked 变 Ready；sensor 再次 vTaskDelayUntil() 阻塞后 logger 才轮到</text>
  <text x="20" y="590" font-size="11" fill="#6b7280">ISR 里只能用 ...FromISR() 版本，且该中断优先级数值 ≥ configMAX_SYSCALL_INTERRUPT_PRIORITY（本课 5）；portYIELD_FROM_ISR() 让高优先级任务在中断返回时直接运行。</text>
</svg>
