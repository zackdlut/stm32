<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">中断发生时 CPU 做了什么：硬件自动压栈、跳转、返回</text>

  <!-- lanes -->
  <text x="30" y="96" font-weight="bold" fill="#374151">外设</text>
  <text x="30" y="176" font-weight="bold" fill="#374151">硬件</text>
  <text x="30" y="256" font-weight="bold" fill="#374151">软件</text>
  <line x1="90" y1="120" x2="980" y2="120" stroke="#e5e7eb"/>
  <line x1="90" y1="200" x2="980" y2="200" stroke="#e5e7eb"/>

  <!-- peripheral event -->
  <rect x="150" y="70" width="170" height="40" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="235" y="95" text-anchor="middle" font-size="13" fill="#111827">事件：按键边沿 / 收到字节</text>
  <path d="M320,90 L350,90 L350,150 L366,150" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="358" y="80" font-size="12" fill="#374151">置位挂起标志</text>

  <!-- NVIC -->
  <rect x="370" y="130" width="140" height="56" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="440" y="152" text-anchor="middle" font-weight="bold" fill="#3730a3">NVIC 仲裁</text>
  <text x="440" y="172" text-anchor="middle" font-size="11" fill="#374151">已使能？优先级够高？</text>

  <rect x="530" y="130" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="152" text-anchor="middle" font-weight="bold" fill="#1d4ed8">自动压栈 8 个寄存器</text>
  <text x="630" y="172" text-anchor="middle" font-size="11" fill="#374151">LR ← EXC_RETURN，查向量表取地址</text>
  <line x1="510" y1="158" x2="526" y2="158" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="800" y="130" width="170" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="885" y="152" text-anchor="middle" font-weight="bold" fill="#1d4ed8">自动出栈</text>
  <text x="885" y="172" text-anchor="middle" font-size="11" fill="#374151">恢复寄存器，回到被打断处</text>

  <!-- software timeline -->
  <rect x="100" y="230" width="380" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="290" y="255" text-anchor="middle" fill="#111827">main() 正在执行……</text>
  <rect x="560" y="230" width="230" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="675" y="255" text-anchor="middle" fill="#991b1b">XXX_IRQHandler()：清标志、记录</text>
  <rect x="870" y="230" width="110" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="925" y="255" text-anchor="middle" fill="#111827">main() 继续</text>
  <path d="M480,250 L520,250 L520,192" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="M730,186 L745,186 L745,210 L675,210 L675,226" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M790,250 L810,250 L810,192" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="815" y="218" font-size="11" fill="#dc2626">bx lr</text>
  <path d="M885,186 L885,210 L925,210 L925,226" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="500" y="290" text-anchor="middle" font-size="11" fill="#6b7280">在任意两条指令之间被打断</text>
  <text x="675" y="290" text-anchor="middle" font-size="11" fill="#6b7280">就是普通 C 函数</text>

  <!-- stack frame -->
  <rect x="40" y="320" width="420" height="220" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="250" y="346" text-anchor="middle" font-weight="bold" fill="#111827">硬件压栈的内容（异常栈帧）</text>
  <g font-size="13">
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="160" y="360" width="160" height="20"/><rect x="160" y="380" width="160" height="20"/>
      <rect x="160" y="400" width="160" height="20"/><rect x="160" y="420" width="160" height="20"/>
      <rect x="160" y="440" width="160" height="20"/><rect x="160" y="460" width="160" height="20"/>
      <rect x="160" y="480" width="160" height="20"/><rect x="160" y="500" width="160" height="20"/>
    </g>
    <g text-anchor="middle" fill="#111827" font-family="monospace">
      <text x="240" y="375">xPSR</text><text x="240" y="395">PC（返回地址）</text>
      <text x="240" y="415">LR</text><text x="240" y="435">R12</text>
      <text x="240" y="455">R3</text><text x="240" y="475">R2</text>
      <text x="240" y="495">R1</text><text x="240" y="515">R0</text>
    </g>
    <text x="150" y="375" text-anchor="end" font-size="11" fill="#6b7280">高地址</text>
    <text x="150" y="515" text-anchor="end" font-size="11" fill="#6b7280">SP 指向这里</text>
    <text x="330" y="420" font-size="12" fill="#374151">正好是 AAPCS</text>
    <text x="330" y="438" font-size="12" fill="#374151">调用者保存的</text>
    <text x="330" y="456" font-size="12" fill="#374151">寄存器</text>
    <text x="330" y="484" font-size="11" fill="#6b7280">(开 FPU 时还有</text>
    <text x="330" y="500" font-size="11" fill="#6b7280"> S0~S15、FPSCR)</text>
  </g>

  <!-- rules -->
  <rect x="490" y="320" width="490" height="220" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="735" y="346" text-anchor="middle" font-weight="bold" fill="#991b1b">所以中断处理函数可以直接用 C 写，但要守规矩</text>
  <g font-size="13" fill="#111827">
    <text x="506" y="376">• 函数名必须与向量表中的名字一致（拼错 → 进 Default_Handler）</text>
    <text x="506" y="402">• 先清除外设的挂起标志，否则返回后立刻再次进入</text>
    <text x="506" y="428">• 尽量短：只搬数据、置标志，耗时工作交给 main()</text>
    <text x="506" y="454">• 与 main() 共享的变量加 volatile</text>
    <text x="506" y="480">• 多字节共享数据：main() 读取时临时关中断</text>
    <text x="506" y="506">• 优先级数字越小越紧急；高优先级可打断低优先级</text>
    <text x="506" y="530" font-size="12" fill="#6b7280">进入延迟约 12 个时钟周期（无等待状态时）</text>
  </g>
</svg>
