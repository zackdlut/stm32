<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">按键电路、抖动波形与软件消抖</text>

  <!-- circuit -->
  <rect x="20" y="52" width="300" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="78" text-anchor="middle" font-weight="bold" fill="#15803d">用户按键 B1 → PA0</text>
  <line x1="90" y1="100" x2="130" y2="100" stroke="#111827" stroke-width="3"/>
  <text x="110" y="94" text-anchor="middle" font-size="12" fill="#374151">VDD 3.3V</text>
  <line x1="110" y1="100" x2="110" y2="140" stroke="#111827" stroke-width="3"/>
  <!-- switch -->
  <circle cx="110" cy="144" r="4" fill="#111827"/>
  <line x1="110" y1="144" x2="140" y2="176" stroke="#111827" stroke-width="3"/>
  <circle cx="110" cy="184" r="4" fill="#111827"/>
  <text x="150" y="168" font-size="12" fill="#374151">按键</text>
  <line x1="110" y1="184" x2="110" y2="220" stroke="#111827" stroke-width="3"/>
  <line x1="110" y1="220" x2="250" y2="220" stroke="#111827" stroke-width="3"/>
  <circle cx="110" cy="220" r="4" fill="#111827"/>
  <rect x="236" y="206" width="28" height="28" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <text x="250" y="254" text-anchor="middle" font-weight="bold" fill="#111827">PA0</text>
  <!-- pull-down -->
  <rect x="98" y="236" width="24" height="50" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <line x1="110" y1="220" x2="110" y2="236" stroke="#111827" stroke-width="3"/>
  <text x="130" y="266" font-size="12" fill="#374151">下拉电阻</text>
  <line x1="110" y1="286" x2="110" y2="306" stroke="#111827" stroke-width="3"/>
  <line x1="90" y1="306" x2="130" y2="306" stroke="#111827" stroke-width="3"/>
  <line x1="97" y1="313" x2="123" y2="313" stroke="#111827" stroke-width="3"/>
  <text x="110" y="334" text-anchor="middle" font-size="12" fill="#374151">GND</text>
  <text x="190" y="296" font-size="12" fill="#111827">松开：被拉到 0</text>
  <text x="190" y="316" font-size="12" fill="#111827">按下：接通 VDD = 1</text>

  <!-- waveforms -->
  <rect x="340" y="52" width="640" height="300" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="660" y="78" text-anchor="middle" font-weight="bold" fill="#111827">机械触点闭合时会“抖动”几毫秒</text>

  <text x="355" y="112" font-size="13" fill="#374151">理想</text>
  <path d="M420,130 L520,130 L520,95 L800,95 L800,130 L960,130" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <text x="355" y="182" font-size="13" fill="#374151">实际 IDR</text>
  <path d="M420,200 L520,200 L520,165 L532,165 L532,200 L541,200 L541,165 L559,165 L559,200 L565,200 L565,165 L577,165 L577,200 L583,200 L583,165 L800,165 L800,200 L960,200" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="520" y1="212" x2="583" y2="212" stroke="#dc2626" stroke-width="1.5"/>
  <text x="552" y="228" text-anchor="middle" font-size="11" fill="#dc2626">抖动约 10 ms</text>
  <text x="900" y="160" font-size="11" fill="#dc2626">上升沿：5 个</text>

  <text x="355" y="262" font-size="13" fill="#374151">消抖后</text>
  <path d="M420,280 L603,280 L603,245 L820,245 L820,280 L960,280" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="583" y1="292" x2="603" y2="292" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="800" y1="292" x2="820" y2="292" stroke="#16a34a" stroke-width="1.5"/>
  <text x="603" y="310" text-anchor="middle" font-size="11" fill="#16a34a">稳定 20 ms 后才确认</text>
  <text x="900" y="240" font-size="11" fill="#16a34a">上升沿：1 个</text>

  <line x1="420" y1="335" x2="960" y2="335" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="955" y="328" text-anchor="end" font-size="11" fill="#6b7280">时间</text>

  <!-- algorithm -->
  <rect x="20" y="372" width="960" height="170" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="40" y="398" font-weight="bold" fill="#5b21b6">计数消抖算法（第 5 课）：每 1 ms 采样一次</text>
  <g font-family="monospace" font-size="13" fill="#111827" xml:space="preserve">
    <text x="40" y="428">raw = 读 IDR;</text>
    <text x="40" y="450">if (raw == stable_level)  count = 0;            // 与确认电平一致：计数归零</text>
    <text x="40" y="472">else if (++count &gt;= 20) {                        // 新电平连续保持 20 次</text>
    <text x="40" y="494">    stable_level = raw;  count = 0;              // 才接受它</text>
    <text x="40" y="516">    if (stable_level) 处理一次“按下”;</text>
    <text x="40" y="538">}</text>
  </g>
  <text x="960" y="516" text-anchor="end" font-size="12" fill="#5b21b6">任何一次反弹都会让 count 归零重来</text>
</svg>
