<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">SysTick：24 位递减计数器，减到 0 时触发中断并自动重装</text>

  <!-- axes -->
  <line x1="90" y1="250" x2="960" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="250" x2="90" y2="60" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="80" y="70" text-anchor="end" font-size="12" fill="#374151">VAL</text>
  <text x="955" y="272" text-anchor="end" font-size="12" fill="#374151">时间</text>
  <line x1="86" y1="90" x2="960" y2="90" stroke="#d1d5db" stroke-dasharray="4 4"/>
  <text x="80" y="94" text-anchor="end" font-size="12" fill="#2563eb">LOAD</text>
  <text x="80" y="254" text-anchor="end" font-size="12" fill="#374151">0</text>

  <!-- sawtooth -->
  <path d="M100,90 L300,250 L300,90 L500,250 L500,90 L700,250 L700,90 L900,250 L900,90" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- interrupts -->
  <g fill="#dc2626">
    <path d="M300,262 l-7,14 h14 z"/><path d="M500,262 l-7,14 h14 z"/><path d="M700,262 l-7,14 h14 z"/><path d="M900,262 l-7,14 h14 z"/>
  </g>
  <text x="300" y="294" text-anchor="middle" font-size="12" fill="#dc2626">SysTick_Handler</text>
  <text x="500" y="294" text-anchor="middle" font-size="12" fill="#dc2626">g_ticks++</text>
  <text x="700" y="294" text-anchor="middle" font-size="12" fill="#dc2626">g_ticks++</text>
  <text x="900" y="294" text-anchor="middle" font-size="12" fill="#dc2626">g_ticks++</text>

  <line x1="300" y1="70" x2="500" y2="70" stroke="#374151" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#111827">1 ms = LOAD + 1 个时钟周期</text>

  <!-- formula -->
  <rect x="40" y="320" width="440" height="100" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="56" y="346" font-weight="bold" fill="#3730a3">计算 LOAD</text>
  <text x="56" y="372" font-family="monospace" font-size="13" fill="#111827">LOAD = f_core / 1000 - 1</text>
  <text x="56" y="396" font-size="13" fill="#111827">16 MHz → 15999；168 MHz → 167999</text>
  <text x="56" y="414" font-size="11" fill="#6b7280">LOAD 最大 0xFFFFFF（24 位）</text>

  <rect x="510" y="320" width="460" height="100" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="526" y="346" font-weight="bold" fill="#111827">三个寄存器（地址 0xE000E010 起）</text>
  <g font-size="13" fill="#111827">
    <text x="526" y="370"><tspan font-family="monospace">CTRL</tspan>  ENABLE | TICKINT | CLKSOURCE | COUNTFLAG</text>
    <text x="526" y="392"><tspan font-family="monospace">LOAD</tspan>  重装值</text>
    <text x="526" y="412"><tspan font-family="monospace">VAL </tspan>  当前值，写任意值清零</text>
  </g>
</svg>
