<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">GDB 调试：模拟器和真板只差中间一层</text>

  <!-- GDB -->
  <rect x="20" y="150" width="200" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="178" text-anchor="middle" font-weight="bold" fill="#5b21b6">gdb-multiarch</text>
  <text x="120" y="204" text-anchor="middle" font-size="12" fill="#374151">读取 firmware.elf 的</text>
  <text x="120" y="222" text-anchor="middle" font-size="12" fill="#374151">符号与行号信息（-g）</text>
  <text x="120" y="250" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">break / step / bt</text>
  <text x="120" y="270" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">print / x / watch</text>
  <text x="120" y="290" text-anchor="middle" font-size="11" fill="#6b7280">（或 VS Code / CubeIDE 界面）</text>

  <!-- top: Renode -->
  <path d="M220,195 L300,195 L300,110 L346,110" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M220,255 L300,255 L300,340 L346,340" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="232" text-anchor="middle" font-size="12" fill="#374151">GDB 远程协议</text>
  <text x="300" y="250" text-anchor="middle" font-size="12" font-family="monospace" fill="#374151">TCP :3333</text>

  <rect x="350" y="60" width="630" height="110" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="370" y="86" font-weight="bold" fill="#c2410c">模拟（本教程）</text>
  <rect x="370" y="100" width="280" height="56" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="510" y="122" text-anchor="middle" fill="#111827">Renode 内置 GDB 服务器</text>
  <text x="510" y="142" text-anchor="middle" font-size="12" font-family="monospace" fill="#374151">machine StartGdbServer 3333</text>
  <rect x="690" y="100" width="270" height="56" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="825" y="122" text-anchor="middle" fill="#111827">虚拟 Cortex-M4 + 外设</text>
  <text x="825" y="142" text-anchor="middle" font-size="12" fill="#374151">可随时暂停、查看任意寄存器</text>
  <line x1="650" y1="128" x2="686" y2="128" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- bottom: hardware -->
  <rect x="350" y="280" width="630" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="306" font-weight="bold" fill="#15803d">真实硬件（第 15 课）</text>
  <rect x="370" y="320" width="170" height="64" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="455" y="345" text-anchor="middle" fill="#111827">OpenOCD</text>
  <text x="455" y="366" text-anchor="middle" font-size="11" fill="#374151">或 st-util / pyOCD</text>
  <rect x="580" y="320" width="150" height="64" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="655" y="345" text-anchor="middle" fill="#111827">ST-LINK</text>
  <text x="655" y="366" text-anchor="middle" font-size="11" fill="#374151">调试探头</text>
  <rect x="770" y="320" width="190" height="64" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="865" y="345" text-anchor="middle" fill="#111827">STM32 芯片</text>
  <text x="865" y="366" text-anchor="middle" font-size="11" fill="#374151">内核里的调试单元 CoreSight</text>
  <line x1="540" y1="352" x2="576" y2="352" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="558" y="344" text-anchor="middle" font-size="10" fill="#374151">USB</text>
  <line x1="730" y1="352" x2="766" y2="352" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="748" y="344" text-anchor="middle" font-size="10" fill="#374151">SWD</text>

  <text x="500" y="436" text-anchor="middle" font-size="13" fill="#111827">GDB 端命令完全相同：target remote :3333，然后 load / break / continue</text>
</svg>
